ingestion:
  log_path: /var/log/auth.log
  poll_interval_seconds: 1.0
  # Use windows_event_log on Windows 11; file remains the default for Linux fixtures.
  source: file
  log_names:
    - Security
    - System
    - Microsoft-Windows-PowerShell/Operational
    - Microsoft-Windows-Sysmon/Operational
    - Microsoft-Windows-Windows Defender/Operational

detection:
  window_seconds: 300
  failed_attempt_threshold: 5
  baseline_path: globalban-baseline.json
  baseline_warmup_events: 20

policy:
  allowlist:
    - 127.0.0.1
    - ::1
  block_private_addresses: true

actions:
  dry_run: true
  # Example for Linux with iptables. Configure deliberately and run with
  # appropriate privileges before setting dry_run to false.
  firewall_command:
    - iptables
    - -I
    - INPUT
    - -s
    - "{ip}"
    - -j
    - DROP
  rollback_command:
    - iptables
    - -D
    - INPUT
    - -s
    - "{ip}"
    - -j
    - DROP

audit:
  path: globalban-audit.jsonl

ai:
  enabled: true
  base_url: http://192.168.52.131:8080/v1
  model: gemini-2.5-flash

notifications:
  whatsapp_enabled: false
