[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "globalban"
version = "0.1.0"
description = "A defensive SSH authentication log monitor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
globalban = "globalban.main:main"
globalban-proxy = "globalban.proxy:main"
globalban-app = "globalban.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"globalban.ai" = ["prompt.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
